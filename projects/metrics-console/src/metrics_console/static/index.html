<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Metrics · 分析台</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260727c" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar glass" aria-label="导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>Metrics</h1>
            <p>Quack · e2ed / orchestrator</p>
          </div>
        </div>
        <nav class="nav" id="nav">
          <button type="button" data-view="overview" class="active">概览</button>
          <button type="button" data-view="api">API 延迟</button>
          <button type="button" data-view="lifecycle">生命周期</button>
          <button type="button" data-view="components">组件</button>
          <button type="button" data-view="explore">表浏览</button>
          <button type="button" data-view="sql">SQL</button>
        </nav>
        <div class="status-pill" id="healthPill" title="Quack 连通性">
          <span class="dot" id="healthDot"></span>
          <div class="status-copy">
            <span class="status-title" id="healthText">连接中…</span>
            <span class="status-sub" id="pollMeta">—</span>
          </div>
        </div>
      </aside>

      <div class="content">
        <header class="chrome glass">
          <div class="chrome-left">
            <h2 id="pageTitle">概览</h2>
            <p class="sub" id="pageSub">时间窗内的窗口计数与差分刷新</p>
          </div>
          <div class="chrome-right">
            <div class="seg" id="rangeSeg" role="tablist" aria-label="时间范围">
              <button type="button" data-range="15m" role="tab">15m</button>
              <button type="button" data-range="1h" role="tab" class="active">1h</button>
              <button type="button" data-range="6h" role="tab">6h</button>
              <button type="button" data-range="24h" role="tab">24h</button>
              <button type="button" data-range="7d" role="tab">7d</button>
            </div>
            <button class="btn ghost" id="btnLive" type="button" aria-pressed="true" title="差分轮询">
              <span class="live-dot"></span> Live
            </button>
            <button class="btn secondary" id="btnRefresh" type="button">刷新</button>
          </div>
        </header>

        <main class="main">
          <!-- Overview -->
          <section id="view-overview">
            <div class="grid kpi" id="kpiGrid" aria-live="off"></div>

            <!-- 单一组件：标题 + 图例 + 折线同属一张 card，不内嵌第二层卡片 -->
            <article class="chart-card" id="latencyCard">
              <header class="chart-card-head">
                <div class="chart-card-title">
                  <h3>API 延迟</h3>
                  <p class="panel-sub" id="latencyCaption">avg / p95 · ms</p>
                </div>
                <div class="chart-legend" aria-hidden="true">
                  <span class="leg avg"><i></i>avg</span>
                  <span class="leg p95"><i></i>p95</span>
                  <span class="chip" id="latencyChip">—</span>
                </div>
              </header>
              <div class="chart-plot">
                <svg class="linechart" id="latencyChart" viewBox="0 0 720 200" preserveAspectRatio="xMidYMid meet" aria-label="API latency line chart"></svg>
                <div class="chart-empty muted hidden" id="latencyEmpty">暂无延迟序列</div>
              </div>
            </article>

            <div class="split">
              <div class="panel">
                <div class="panel-head">
                  <h3>最近 API</h3>
                  <span class="chip soft" id="apiCountChip">0</span>
                </div>
                <div class="table-wrap" id="recentApi"></div>
              </div>
              <div class="panel">
                <div class="panel-head">
                  <h3>Top paths</h3>
                  <span class="chip soft" id="pathCountChip">0</span>
                </div>
                <div class="table-wrap" id="pathTable"></div>
              </div>
            </div>
          </section>

          <!-- API -->
          <section id="view-api" class="hidden">
            <div class="panel">
              <div class="panel-head"><h3>路径聚合</h3></div>
              <div class="table-wrap" id="pathTableFull"></div>
            </div>
            <div class="panel">
              <div class="panel-head"><h3>请求样本</h3></div>
              <div class="table-wrap" id="apiTable"></div>
            </div>
          </section>

          <!-- Lifecycle -->
          <section id="view-lifecycle" class="hidden">
            <div class="panel">
              <div class="panel-head"><h3>服务生命周期</h3></div>
              <div class="table-wrap" id="lifeTable"></div>
            </div>
            <div class="panel">
              <div class="panel-head"><h3>Daemon ticks</h3></div>
              <div class="table-wrap" id="tickTable"></div>
            </div>
          </section>

          <!-- Components -->
          <section id="view-components" class="hidden">
            <div class="panel">
              <div class="panel-head">
                <h3>component_ops</h3>
                <span class="muted">窗口内组件操作</span>
              </div>
              <div class="table-wrap" id="compTable"></div>
            </div>
          </section>

          <!-- Explore -->
          <section id="view-explore" class="hidden">
            <div class="panel">
              <div class="toolbar-row">
                <select class="field" id="tableSelect" aria-label="选择表"></select>
                <button class="btn secondary" type="button" id="btnLoadTable">加载</button>
              </div>
              <div class="table-wrap" id="exploreTable"></div>
            </div>
          </section>

          <!-- SQL -->
          <section id="view-sql" class="hidden">
            <div class="panel">
              <textarea
                class="sql-box"
                id="sqlInput"
                spellcheck="false"
                placeholder="SELECT path, avg(duration_ms) FROM cat_orchestrator.api_requests GROUP BY 1 ORDER BY 2 DESC LIMIT 20"
              ></textarea>
              <div class="toolbar-row">
                <button class="btn" type="button" id="btnRunSql">运行</button>
                <button class="btn secondary" type="button" id="btnSqlApi">样例: API p95</button>
                <button class="btn secondary" type="button" id="btnSqlLife">样例: lifecycle</button>
                <span class="muted" id="sqlMeta"></span>
              </div>
              <div class="error hidden" id="sqlError"></div>
              <div class="table-wrap" id="sqlTable"></div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>
    <script src="/static/app.js?v=20260727c" type="module"></script>
  </body>
</html>
