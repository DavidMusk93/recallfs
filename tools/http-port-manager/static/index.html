<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTTP Port Manager</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --ok: #3dd68c;
      --warn: #f5a524;
      --err: #f31260;
      --accent: #3b82f6;
      --accent2: #60a5fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1e3a5f55, transparent),
                  radial-gradient(900px 500px at 100% 0%, #134e4a33, transparent),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      background: #0f1419cc;
      z-index: 10;
    }
    h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px #3dd68c88; }
    .dot.err { background: var(--err); }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 3rem;
      display: grid;
      gap: 1.25rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      box-shadow: 0 8px 30px #0004;
    }
    .card h2 {
      margin: 0 0 0.85rem;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    form.grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.65rem;
      align-items: end;
    }
    label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    input, select, button, textarea {
      font: inherit;
    }
    input {
      background: #0c121b;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      border: 0;
      border-radius: 8px;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      background: var(--accent);
      color: white;
      font-weight: 600;
    }
    button:hover { background: var(--accent2); }
    button.ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.ghost:hover { border-color: var(--accent); color: var(--accent2); }
    button.danger { background: #7f1d1d; }
    button.danger:hover { background: #991b1b; }
    button.ok { background: #166534; }
    button.ok:hover { background: #15803d; }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .grant {
      display: grid;
      gap: 0.5rem;
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      border: 1px solid #7f1d1d;
      background: #2a0a12;
    }
    .grant p { margin: 0; font-size: 0.82rem; line-height: 1.45; }
    .grant .lead { color: #f9a8d4; }
    .grant .why { color: var(--muted); }
    .grant-progress {
      min-height: 1.1em;
      font-size: 0.78rem;
      color: var(--accent2);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .hint {
      margin: 0.15rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
    }
    @media (prefers-reduced-motion: reduce) {
      button:active { transform: none; }
    }
    .svc {
      display: grid;
      gap: 0.75rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border);
    }
    .svc:last-child { border-bottom: 0; padding-bottom: 0; }
    .svc:first-child { padding-top: 0; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      align-items: center;
    }
    .name { font-weight: 650; font-size: 1.02rem; }
    .badge {
      font-size: 0.72rem;
      padding: 0.18rem 0.5rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge.healthy { color: var(--ok); border-color: #14532d; background: #052e16; }
    .badge.running { color: var(--warn); border-color: #78350f; background: #1c1408; }
    .badge.stopped { color: var(--muted); }
    .badge.error { color: var(--err); border-color: #7f1d1d; background: #2a0a12; }
    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.45rem 0.75rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .meta b { color: var(--text); font-weight: 600; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .actions a {
      color: var(--accent2);
      text-decoration: none;
      font-size: 0.85rem;
      align-self: center;
      margin-right: 0.4rem;
    }
    .actions a:hover { text-decoration: underline; }
    .empty {
      color: var(--muted);
      padding: 1rem 0;
      text-align: center;
    }
    .msg {
      margin-top: 0.6rem;
      font-size: 0.82rem;
      color: var(--err);
      min-height: 1.1em;
    }
    .msg.warn { color: var(--warn); }
    footer {
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
      padding: 0 1rem 2rem;
    }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>HTTP Port Manager</h1>
      <div class="sub">多端口静态服务 · SSE 实时指标 · launchd 常驻</div>
    </div>
    <div class="pill" id="connPill">
      <span class="dot" id="connDot"></span>
      <span id="connText">connecting…</span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>新建服务</h2>
      <form class="grid" id="createForm">
        <label>ID
          <input name="id" placeholder="algorithms" />
        </label>
        <label>名称
          <input name="name" placeholder="Algorithms Lab" />
        </label>
        <label>端口
          <input name="port" type="number" min="1" max="65535" required placeholder="8000" />
        </label>
        <label>Bind
          <input name="bind" value="0.0.0.0" />
        </label>
        <label style="grid-column: 1 / -1">目录 root
          <input name="root" required placeholder="/path/to/dir" />
          <span class="hint">Documents / Desktop / Downloads 对 LaunchAgent 不可读。创建后可在卡片上「选择目录」写入镜像；网页无法给 python3 开完全磁盘访问。</span>
        </label>
        <label>自动启动
          <input name="auto_start" type="checkbox" checked style="width:auto;justify-self:start" />
        </label>
        <button type="submit">创建并启动</button>
      </form>
      <div class="msg" id="formMsg"></div>
    </section>

    <section class="card">
      <h2>服务列表 <span id="svcCount" style="font-weight:500;text-transform:none;letter-spacing:0"></span></h2>
      <div id="list"><div class="empty">等待 SSE…</div></div>
    </section>

    <section class="card">
      <h2>Algorithms Lab · 后台会话（AI only）</h2>
      <p style="margin:0 0 0.75rem;color:var(--muted);font-size:0.85rem">
        静默埋点 → <code>/api/lab/events</code>。学习者页面不展示分析 UI；
        助手读 <code>/api/lab/coach?problemId=N</code> 评估理解程度。
      </p>
      <div class="actions" style="margin-bottom:0.75rem">
        <button type="button" class="ghost" id="labRefresh">刷新会话</button>
        <button type="button" class="ghost" id="labCoach1">Coach #1</button>
        <button type="button" class="ghost" id="labCoach2">Coach #2</button>
      </div>
      <div id="labSessions" class="empty">加载中…</div>
      <pre id="labCoach" style="margin-top:0.75rem;padding:0.75rem;background:#0c121b;border-radius:8px;border:1px solid var(--border);font-size:0.78rem;white-space:pre-wrap;color:var(--muted);max-height:280px;overflow:auto"></pre>
    </section>
  </main>

  <input id="grantPicker" type="file" webkitdirectory directory multiple hidden />

  <footer>
    Manager PID <code id="mgrPid">—</code> · 更新于 <code id="updatedAt">—</code>
    · <span id="accessHint">—</span>
  </footer>

  <script>
    const listEl = document.getElementById('list');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');
    const formMsg = document.getElementById('formMsg');
    const mgrPid = document.getElementById('mgrPid');
    const updatedAt = document.getElementById('updatedAt');
    const svcCount = document.getElementById('svcCount');

    let lastSig = '';
    let es = null;
    let pendingGrantId = null;
    const grantPicker = document.getElementById('grantPicker');
    const SKIP_DIR = new Set(['.git', 'target', '.tmp', '__pycache__', 'node_modules']);
    const SKIP_FILE = new Set(['.DS_Store']);
    const GRANT_MAX_BYTES = 80 * 1024 * 1024;
    const GRANT_BATCH_BYTES = 2 * 1024 * 1024;

    function fmtBytes(n) {
      if (n == null) return '0 B';
      const u = ['B','KB','MB','GB'];
      let i = 0, x = Number(n);
      while (x >= 1024 && i < u.length - 1) { x /= 1024; i++; }
      return (i === 0 ? x : x.toFixed(1)) + ' ' + u[i];
    }

    function badgeClass(s) {
      if (s.healthy) return 'healthy';
      if (s.status === 'error') return 'error';
      if (s.running) return 'running';
      return 'stopped';
    }

    function badgeText(s) {
      if (s.healthy) return 'healthy';
      return s.status || 'unknown';
    }

    function render(services) {
      if (!services || !services.length) {
        listEl.innerHTML = '<div class="empty">暂无服务。在上方创建一个，或编辑 config.json。</div>';
        svcCount.textContent = '';
        return;
      }
      svcCount.textContent = `(${services.length})`;
      listEl.innerHTML = services.map(s => {
        const m = s.metrics || {};
        return `
          <div class="svc" data-id="${s.id}">
            <div class="row">
              <div class="title">
                <span class="name">${escapeHtml(s.name || s.id)}</span>
                <span class="badge ${badgeClass(s)}">${badgeText(s)}</span>
                <span class="badge">:${s.port}</span>
              </div>
              <div class="actions">
                <a href="${escapeAttr(s.url)}" target="_blank" rel="noopener">打开</a>
                <button class="ok" data-act="start" data-id="${escapeAttr(s.id)}">Start</button>
                <button class="ghost" data-act="stop" data-id="${escapeAttr(s.id)}">Stop</button>
                <button class="ghost" data-act="restart" data-id="${escapeAttr(s.id)}">Restart</button>
                <button class="ghost" data-act="sync" data-id="${escapeAttr(s.id)}">Sync</button>
                <button class="danger" data-act="delete" data-id="${escapeAttr(s.id)}">Delete</button>
              </div>
            </div>
            <div class="meta">
              <div>id <b>${escapeHtml(s.id)}</b></div>
              <div>bind <b>${escapeHtml(s.bind)}</b></div>
              <div>uptime <b>${s.uptime_sec ?? 0}s</b></div>
              <div>requests <b>${m.requests_total ?? 0}</b></div>
              <div>bytes <b>${fmtBytes(m.bytes_sent)}</b></div>
              <div>2xx/4xx/5xx <b>${m.status_2xx ?? 0}/${m.status_4xx ?? 0}/${m.status_5xx ?? 0}</b></div>
              <div>last path <b>${escapeHtml(m.last_path || '—')}</b></div>
              <div>last error <b>${escapeHtml(m.last_error || '—')}</b></div>
              <div>note <b>${escapeHtml(m.note || '—')}</b></div>
              <div>mirror <b>${s.mirrored ? 'yes' : 'no'}</b></div>
              <div style="grid-column:1/-1">root <b><code>${escapeHtml(s.root)}</code></b></div>
              <div style="grid-column:1/-1">serve <b><code>${escapeHtml(s.serve_root || m.serve_root || '—')}</code></b></div>
            </div>
            ${s.needs_grant ? grantPanel(s) : ''}
          </div>`;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }
    function escapeAttr(s) { return escapeHtml(s).replaceAll("'", '&#39;'); }

    function grantPanel(s) {
      const g = s.grant || {};
      const cmd = g.sync_cmd || 'tools/http-port-manager/sync.sh';
      return `
            <div class="grant" data-grant-id="${escapeAttr(s.id)}">
              <p class="lead">需要授权才能提供此目录（macOS TCC）</p>
              <p class="why">网页不能给 <code>${escapeHtml(g.python || 'python3')}</code> 弹出「完全磁盘访问」。请在本页选择该目录：浏览器读取后写入镜像 <code>${escapeHtml(g.mirror || '')}</code>，LaunchAgent 即可对外服务。</p>
              <div class="actions">
                <button type="button" class="ok" data-act="grant" data-id="${escapeAttr(s.id)}">选择目录并写入镜像</button>
                <button type="button" class="ghost" data-act="copy-sync" data-cmd="${escapeAttr(cmd)}">复制 sync.sh</button>
              </div>
              <div class="grant-progress" aria-live="polite"></div>
            </div>`;
    }

    function shouldSkipName(name) {
      return SKIP_DIR.has(name) || SKIP_FILE.has(name) || name.endsWith('.pyc');
    }

    function fileToB64(buf) {
      const bytes = new Uint8Array(buf);
      const chunk = 0x8000;
      let bin = '';
      for (let i = 0; i < bytes.length; i += chunk) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(bin);
    }

    async function walkDirectoryHandle(handle, prefix) {
      const out = [];
      for await (const [name, child] of handle.entries()) {
        if (shouldSkipName(name)) continue;
        const rel = prefix ? prefix + '/' + name : name;
        if (child.kind === 'directory') {
          out.push(...await walkDirectoryHandle(child, rel));
        } else {
          out.push({ path: rel, file: await child.getFile() });
        }
      }
      return out;
    }

    function filesFromInput(list) {
      const out = [];
      for (const f of list) {
        const parts = String(f.webkitRelativePath || f.name).split('/').filter(Boolean);
        if (parts.some(shouldSkipName)) continue;
        const rel = parts.length > 1 ? parts.slice(1).join('/') : parts[0];
        if (!rel) continue;
        out.push({ path: rel, file: f });
      }
      return out;
    }

    function setGrantProgress(id, text) {
      document.querySelectorAll('[data-grant-id]').forEach((el) => {
        if (el.getAttribute('data-grant-id') !== id) return;
        const p = el.querySelector('.grant-progress');
        if (p) p.textContent = text || '';
      });
    }

    async function uploadGrant(id, items) {
      const total = items.reduce((s, x) => s + (x.file.size || 0), 0);
      if (!items.length) throw new Error('目录是空的');
      if (total > GRANT_MAX_BYTES) {
        throw new Error(`目录 ${fmtBytes(total)} 超过网页授权上限，请在 Terminal 运行 sync.sh`);
      }
      let sent = 0;
      let batch = [];
      let batchBytes = 0;
      let reset = true;
      const flush = async (done) => {
        if (!batch.length && !done) return {};
        const files = [];
        for (const it of batch) {
          const buf = await it.file.arrayBuffer();
          files.push({ path: it.path, data: fileToB64(buf) });
        }
        const r = await fetch(`/api/services/${encodeURIComponent(id)}/seed-mirror`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reset, done, files }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || r.statusText);
        reset = false;
        batch = [];
        batchBytes = 0;
        return j;
      };
      for (const it of items) {
        const sz = it.file.size || 0;
        if (batch.length && batchBytes + sz > GRANT_BATCH_BYTES) {
          await flush(false);
          setGrantProgress(id, `已上传 ${fmtBytes(sent)} / ${fmtBytes(total)}`);
        }
        batch.push(it);
        batchBytes += sz;
        sent += sz;
      }
      const j = await flush(true);
      setGrantProgress(id, `镜像已写入，服务已尝试启动`);
      return j;
    }

    async function pickAndGrant(id) {
      try {
        let items = null;
        if (window.showDirectoryPicker) {
          try {
            const dir = await window.showDirectoryPicker();
            items = await walkDirectoryHandle(dir, '');
          } catch (e) {
            if (e && e.name === 'AbortError') return;
            items = null;
          }
        }
        if (!items) {
          pendingGrantId = id;
          grantPicker.value = '';
          grantPicker.click();
          return;
        }
        setGrantProgress(id, `正在写入 ${items.length} 个文件…`);
        await uploadGrant(id, items);
      } catch (e) {
        const msg = e.message || String(e);
        setGrantProgress(id, msg);
        formMsg.textContent = msg;
      }
    }

    grantPicker.addEventListener('change', async () => {
      const id = pendingGrantId;
      pendingGrantId = null;
      if (!id || !grantPicker.files || !grantPicker.files.length) return;
      try {
        const items = filesFromInput(grantPicker.files);
        setGrantProgress(id, `正在写入 ${items.length} 个文件…`);
        await uploadGrant(id, items);
      } catch (e) {
        const msg = e.message || String(e);
        setGrantProgress(id, msg);
        alert(msg);
      }
    });

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        return false;
      }
    }

    function setConn(ok, text) {
      connDot.className = 'dot ' + (ok ? 'ok' : 'err');
      connText.textContent = text;
    }

    function connectSSE() {
      if (es) es.close();
      es = new EventSource('/api/events');
      es.addEventListener('open', () => setConn(true, 'SSE connected'));
      es.addEventListener('update', (ev) => {
        try {
          const data = JSON.parse(ev.data);
          const sig = JSON.stringify(data.services);
          if (sig !== lastSig) {
            lastSig = sig;
            render(data.services || []);
          }
          mgrPid.textContent = data.pid ?? '—';
          updatedAt.textContent = data.time || new Date().toISOString();
          setConn(true, 'SSE live');
        } catch (e) {
          console.error(e);
        }
      });
      es.onerror = () => {
        setConn(false, 'SSE reconnecting…');
      };
    }

    listEl.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('button[data-act]');
      if (!btn) return;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      btn.disabled = true;
      try {
        if (act === 'grant') {
          await pickAndGrant(id);
          return;
        }
        if (act === 'copy-sync') {
          const cmd = btn.dataset.cmd || 'tools/http-port-manager/sync.sh';
          const ok = await copyText(cmd);
          setGrantProgress(id, ok ? `已复制：${cmd}` : cmd);
          return;
        }
        if (act === 'delete') {
          if (!confirm(`删除服务 ${id}？`)) return;
          const r = await fetch(`/api/services/${encodeURIComponent(id)}`, { method: 'DELETE' });
          if (!r.ok) throw new Error(await r.text());
        } else {
          const r = await fetch(`/api/services/${encodeURIComponent(id)}/${act}`, { method: 'POST' });
          if (!r.ok) {
            const j = await r.json().catch(() => ({}));
            throw new Error(j.error || r.statusText);
          }
        }
      } catch (e) {
        alert(e.message || String(e));
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('createForm').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      formMsg.className = 'msg';
      formMsg.textContent = '';
      const fd = new FormData(ev.target);
      const body = {
        id: (fd.get('id') || '').toString().trim() || undefined,
        name: (fd.get('name') || '').toString().trim() || undefined,
        port: Number(fd.get('port')),
        bind: (fd.get('bind') || '0.0.0.0').toString(),
        root: (fd.get('root') || '').toString(),
        auto_start: fd.get('auto_start') === 'on',
      };
      try {
        const r = await fetch('/api/services', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || r.statusText);
        ev.target.reset();
        ev.target.bind.value = '0.0.0.0';
        ev.target.auto_start.checked = true;
        if (j.needs_grant) {
          formMsg.className = 'msg warn';
          formMsg.textContent = '服务已创建，但 LaunchAgent 读不了该目录。请在下方卡片选择目录写入镜像。';
        } else {
          formMsg.className = 'msg';
        }
      } catch (e) {
        formMsg.textContent = e.message || String(e);
      }
    });

    async function loadAccess() {
      const el = document.getElementById('accessHint');
      try {
        const r = await fetch('/api/access');
        const j = await r.json();
        el.textContent = j.tcc_blocked
          ? `Documents TCC blocked · python ${j.python || ''}`
          : `Documents readable · python ${j.python || ''}`;
      } catch {
        el.textContent = 'access probe failed';
      }
    }

    connectSSE();
    loadAccess();

    async function loadLabSessions() {
      const el = document.getElementById('labSessions');
      try {
        const r = await fetch('/api/lab/sessions?limit=12');
        const j = await r.json();
        const rows = j.sessions || [];
        if (!rows.length) {
          el.innerHTML = '<div class="empty">暂无学习会话。打开 learn.html 后自动上报。</div>';
          return;
        }
        el.innerHTML = rows.map(s => `
          <div class="svc">
            <div class="row">
              <div class="title">
                <span class="name">#${escapeHtml(s.problemId ?? '?')} ${escapeHtml(s.slug || '')}</span>
                <span class="badge ${s.passed ? 'healthy' : 'running'}">${s.passed ? 'pass' : 'learning'}</span>
              </div>
              <div class="actions">
                <button class="ghost" data-coach-sid="${escapeAttr(s.sessionId)}">Coach</button>
              </div>
            </div>
            <div class="meta">
              <div>session <b><code>${escapeHtml(s.sessionId || '')}</code></b></div>
              <div>events <b>${s.eventCount ?? 0}</b></div>
              <div>elapsed <b>${escapeHtml(s.elapsedHuman || '—')}</b></div>
              <div>updated <b>${escapeHtml(s.updatedAt || '—')}</b></div>
            </div>
          </div>`).join('');
      } catch (e) {
        el.innerHTML = '<div class="empty">无法加载 lab sessions</div>';
      }
    }

    async function loadCoach(params) {
      const pre = document.getElementById('labCoach');
      pre.textContent = 'loading…';
      try {
        const qs = new URLSearchParams(params).toString();
        const r = await fetch('/api/lab/coach?' + qs);
        const j = await r.json();
        pre.textContent = j.coachPrompt || JSON.stringify(j, null, 2);
      } catch (e) {
        pre.textContent = String(e);
      }
    }

    document.getElementById('labRefresh').addEventListener('click', loadLabSessions);
    document.getElementById('labCoach1').addEventListener('click', () => loadCoach({ problemId: 1 }));
    document.getElementById('labCoach2').addEventListener('click', () => loadCoach({ problemId: 2 }));
    document.getElementById('labSessions').addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-coach-sid]');
      if (!btn) return;
      loadCoach({ sessionId: btn.dataset.coachSid });
    });
    loadLabSessions();
    setInterval(loadLabSessions, 10000);
  </script>
</body>
</html>
